<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerador de QR Code moderno e profissional para links, textos e URLs."
    />
    <title>QR Code Generator | Modern</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <main class="container py-5">
      <section
        class="generator-card row g-4 align-items-center shadow-lg border border-light-subtle rounded-4 overflow-hidden"
        aria-labelledby="page-title"
      >
        <div class="col-lg-6 px-4 px-lg-5 py-4 py-lg-5">
          <div class="brand-block d-flex flex-column justify-content-center gap-3">
            <span class="brand-badge align-self-start">QR Studio</span>
            <h1 id="page-title" class="display-4 fw-bold mb-0">Gerador de QR Code</h1>
            <p class="subtitle text-secondary mb-0">
              Crie códigos QR limpos, rápidos e prontos para uso profissional.
            </p>
          </div>
        </div>

        <div class="col-lg-6 px-4 px-lg-5 py-4 py-lg-5">
          <div class="form-panel bg-white bg-opacity-10 border border-light-subtle rounded-4 p-4">
            <div class="mb-3">
              <label class="form-label text-light fw-semibold" for="text">Texto ou URL</label>
              <textarea
                id="text"
                class="form-control form-control-lg bg-dark text-light border-light-subtle"
                rows="4"
                placeholder="Ex.: https://seusite.com.br ou qualquer texto"
              >https://example.com</textarea>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label text-light fw-semibold" for="size">Tamanho</label>
                <select id="size" class="form-select bg-dark text-light border-light-subtle">
                  <option value="128">128 x 128</option>
                  <option value="192" selected>192 x 192</option>
                  <option value="256">256 x 256</option>
                  <option value="320">320 x 320</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label text-light fw-semibold" for="level">Correção</label>
                <select id="level" class="form-select bg-dark text-light border-light-subtle">
                  <option value="L">Baixa</option>
                  <option value="M">Média</option>
                  <option value="Q">Alta</option>
                  <option value="H" selected>Máxima</option>
                </select>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-3 mb-3">
              <button id="generateBtn" class="btn btn-primary btn-lg px-4" type="button">
                Gerar QR Code
              </button>
              <button id="downloadBtn" class="btn btn-outline-light btn-lg px-4" type="button" disabled>
                Download PNG
              </button>
            </div>

            <p id="status" class="status text-light-emphasis mb-0" aria-live="polite">
              QR Code pronto para geração.
            </p>
          </div>
        </div>

        <div class="col-12 px-4 px-lg-5 pb-4 pb-lg-5">
          <div class="preview-panel border border-light-subtle rounded-4 p-4" aria-live="polite">
            <div class="preview-frame d-flex align-items-center justify-content-center">
              <div id="qrcode" class="qrcode-wrap"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./src/js/index.js" defer></script>
  </body>
</html>
